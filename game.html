<!doctype html><html lang="ru"><meta charset="utf-8"><title>State Bulletin</title>
<style>html,body{margin:0;background:transparent}dialog{padding:0;border:0;width:92vw;height:88vh;background:#fff}button{display:block;margin:6px 12px 6px auto;padding:6px 18px}iframe{width:100%;height:calc(100% - 50px);border:0}</style>
<dialog><button type="button" autofocus>Закрыть</button><iframe title="State Bulletin"></iframe></dialog>
<script>
const panel = document.querySelector('dialog');
const frame = panel.querySelector('iframe');
window.addEventListener('message', event => {
  if (event.data?.action === 'open' && !panel.open) {
    if (!frame.hasAttribute('src')) frame.src = 'docs/index.html';
    panel.showModal();
  }
});
panel.querySelector('button').onclick = () => panel.close();
panel.addEventListener('close', () => fetch('https://' + GetParentResourceName() + '/close', {method:'POST',body:'{}'}));
frame.addEventListener('load', () => {
  try {
    frame.contentDocument.addEventListener('keydown', event => {
      if (event.key === 'Escape') panel.close();
    });
  } catch {}
});
</script></html>
